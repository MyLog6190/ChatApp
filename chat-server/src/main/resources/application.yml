server:
  address: 0.0.0.0
  port: 9999

spring:
  datasource:
    url: jdbc:mysql://${SERVER_IP}:3306/chatdb
    username: chat_app
    password: chatapp
    # url: jdbc:h2:tcp://192.168.0.62/C:/Workspace/h2/chatdb
    # username: sa
    # password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  data:
    redis:
      host: ${SERVER_IP}
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL}
    password: ${GMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

secretKey: jwt-token-create-secret-key-in-chat-app
