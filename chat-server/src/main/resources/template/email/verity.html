<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>이메일 인증</title>
    <style>
      body {
        background-color: #fff7f0;
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 480px;
        margin: 40px auto;
        background-color: #ffffff;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
        text-align: center;
      }

      .logo {
        width: 120px;
        margin-bottom: 16px;
      }

      .title {
        font-size: 20px;
        color: #6b3e26;
        margin-bottom: 8px;
        font-weight: bold;
      }

      .subtitle {
        font-size: 15px;
        color: #8a5c3a;
        margin-bottom: 32px;
      }

      .code-box {
        font-size: 28px;
        font-weight: bold;
        background-color: #fdebd2;
        color: #6b3e26;
        padding: 16px 24px;
        border-radius: 12px;
        display: inline-block;
        letter-spacing: 6px;
        margin-bottom: 32px;
      }

      .footer {
        font-size: 12px;
        color: #a28768;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">이메일 인증 요청</div>
      <div class="subtitle">아래 인증 코드를 앱에 입력해 주세요.</div>
      <div class="code-box" th:text="${code}">12345</div>
      <div class="footer">
        본 메일은 발신 전용입니다. 궁금한 점은 앱 내 고객센터를 이용해 주세요.
      </div>
    </div>
  </body>
</html>
